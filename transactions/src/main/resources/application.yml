server:
  port: 8085
spring:
  application:
    name: transactions-service
  datasource:

    url: ${DBURL}
    username: ${DBUSER}
    password: ${DBPASSWORD}

    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.OracleDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8087}
services:
  audit:
    base-url: ${SERVICES_AUDIT_BASE_URL:http://localhost:8086}
  accounts:
    base-url: ${ACCOUNTS_SERVICE_URL:http://accounts-service}
  customers:
    base-url: ${CUSTOMERS_SERVICE_URL:http://customers-service}

audit:
  internal-key: ${AUDIT_INTERNAL_KEY:local-audit-key}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
