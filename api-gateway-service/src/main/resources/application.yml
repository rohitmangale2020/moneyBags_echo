server:
  port: 8080
spring:
  application:
    name: api-gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8087}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: security-service
              uri: ${SECURITY_SERVICE_URL:http://localhost:8087}
              predicates: [Path=/auth/**]
            - id: users-service
              uri: ${USERS_SERVICE_URL:http://localhost:8081}
              predicates: [Path=/api/users/**]
            - id: customers-service
              uri: ${CUSTOMERS_SERVICE_URL:http://localhost:8082}
              predicates: [Path=/api/customers/**]
            - id: products-service
              uri: ${PRODUCTS_SERVICE_URL:http://localhost:8083}
              predicates: [Path=/api/products/**]
            - id: accounts-service
              uri: ${ACCOUNTS_SERVICE_URL:http://localhost:8084}
              predicates: [Path=/api/accounts/**]
            - id: transactions-service
              uri: ${TRANSACTIONS_SERVICE_URL:http://localhost:8085}
              predicates: [Path=/api/transactions/**]
            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://localhost:8086}
              predicates: [Path=/api/audit/**]
