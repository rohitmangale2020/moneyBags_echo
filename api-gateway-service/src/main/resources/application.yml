server:
  port: 8080
spring:
  application:
    name: api-gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8087}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: security-service
              uri: lb://SECURITY-SERVICE
              predicates: ["Path=/auth,/auth/**,/.well-known,/.well-known/**"]
            - id: users-service
              uri: lb://USERS-SERVICE
              predicates: ["Path=/api/v1/users,/api/v1/users/**"]
            - id: customers-service
              uri: lb://CUSTOMERS-SERVICE
              predicates: ["Path=/api/customers,/api/customers/**"]
            - id: products-service
              uri: lb://PRODUCTS-SERVICE
              predicates: ["Path=/api/v1/products,/api/v1/products/**,/api/v1/product-types,/api/v1/product-types/**"]
            - id: accounts-service
              uri: lb://ACCOUNTS-SERVICE
              predicates: ["Path=/api/accounts,/api/accounts/**"]
            - id: transactions-service
              uri: lb://TRANSACTIONS-SERVICE
              predicates: ["Path=/api/transactions,/api/transactions/**"]
            - id: audit-service
              uri: lb://AUDIT-SERVICE
              predicates: ["Path=/api/audit,/api/audit/**"]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
