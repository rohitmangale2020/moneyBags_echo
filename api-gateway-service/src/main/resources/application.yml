server:
  port: 8080
spring:
  application:
    name: api-gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8087}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: security-service
              uri: lb://security-service
              predicates: ["Path=/auth,/auth/**,/.well-known,/.well-known/**"]
            - id: users-service
              uri: lb://users-service
              predicates: ["Path=/api/v1/users,/api/v1/users/**"]
            - id: customers-service
              uri: lb://customers-service
              predicates: ["Path=/api/customers,/api/customers/**"]
            - id: products-service
              uri: lb://products-service
              predicates: ["Path=/api/v1/products,/api/v1/products/**,/api/v1/product-types,/api/v1/product-types/**"]
            - id: accounts-service
              uri: lb://accounts-service
              predicates: ["Path=/api/accounts,/api/accounts/**"]
            - id: transactions-service
              uri: lb://transactions-service
              predicates: ["Path=/api/transactions,/api/transactions/**"]
            - id: fixed-deposits-service
              uri: lb://transactions-service
              predicates: ["Path=/api/fixed-deposits,/api/fixed-deposits/**,/api/deposit-processing,/api/deposit-processing/**"]
            - id: statements-service
              uri: lb://transactions-service
              predicates: ["Path=/api/statements,/api/statements/**"]
            - id: ledger-service
              uri: lb://transactions-service
              predicates: ["Path=/api/ledger,/api/ledger/**"]
            - id: audit-service
              uri: lb://audit-service
              predicates: ["Path=/api/audit,/api/audit/**"]

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

services:
  audit:
    base-url: ${SERVICES_AUDIT_BASE_URL:http://localhost:8086}

audit:
  internal-key: ${AUDIT_INTERNAL_KEY:local-audit-key}

