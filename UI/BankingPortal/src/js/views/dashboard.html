<section class="mb-operations-dashboard">
  <div class="mb-loading mb-moneybags-loader mb-dashboard-loader" data-bind="visible:state.loading" role="status" aria-live="polite"><img class="mb-moneybags-loader-logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='white'/%3E%3Ctext x='18' y='25' text-anchor='middle' font-family='Arial,sans-serif' font-size='20' font-weight='800' fill='%23355eb8'%3EM%3C/text%3E%3C/svg%3E" alt="" aria-hidden="true"><strong>Loading dashboard</strong><small>Preparing live banking data…</small></div>
  <div class="mb-error" data-bind="visible:state.error"><strong>Dashboard data could not be loaded</strong><span data-bind="text:state.error"></span><button data-bind="click:load">Retry</button></div>
  <oj-bind-if test="[[!isCustomer()]]">
    <div class="mb-ops-filters"><div class="mb-date-range" aria-label="Dashboard date range"><span class="mb-date-range-label">Calendar</span><label><span>From</span><input type="date" data-bind="value:startDate,event:{change:applyDateRange}"></label><span class="mb-date-range-divider" aria-hidden="true">→</span><label><span>To</span><input type="date" data-bind="value:endDate,event:{change:applyDateRange}"></label></div><div class="mb-ops-periods" aria-label="Date timeline"><button data-bind="click:()=>setPeriod('ALL'),css:{selected:period()==='ALL'}">All</button><button data-bind="click:()=>setPeriod('TODAY'),css:{selected:period()==='TODAY'}">Today</button><button data-bind="click:()=>setPeriod('7D'),css:{selected:period()==='7D'}">7D</button><button data-bind="click:()=>setPeriod('30D'),css:{selected:period()==='30D'}">30D</button><button data-bind="click:()=>setPeriod('MTD'),css:{selected:period()==='MTD'}">MTD</button><button data-bind="click:()=>setPeriod('YTD'),css:{selected:period()==='YTD'}">YTD</button></div><div class="mb-dashboard-refresh"><small data-bind="text:lastUpdatedLabel"></small><button type="button" data-bind="click:refreshDashboard" aria-label="Refresh dashboard">↻</button></div></div>
    <div class="mb-ops-kpis" data-bind="foreach:metrics"><article data-bind="css:tone"><small data-bind="text:label"></small><strong data-bind="text:value"></strong><em data-bind="text:note"></em></article></div>
    <main class="mb-ops-grid">
      <article class="mb-ops-card mb-ops-pulse"><header><h2>Operational pulse</h2><div><select aria-label="Chart activity" data-bind="value:activityMetric"><option value="TRANSACTIONS">Transactions</option><option value="ACCOUNTS">Accounts opened</option></select><button data-bind="click:toggleComparison,text:showComparison()?'Compared':'Compare'"></button><button data-bind="click:refreshActivity" aria-label="Refresh dashboard">↻</button></div></header><div class="mb-ops-key" data-bind="with:operationalPulse"><span class="primary" data-bind="text:primaryLabel"></span><span class="secondary" data-bind="visible:showComparison,text:secondaryLabel"></span></div><div class="mb-ops-chart-wrap"><svg class="mb-ops-line" viewBox="0 0 680 224" role="img" aria-label="Operational pulse chart" data-bind="with:operationalPulse"><g data-bind="foreach:grid"><line x1="36" x2="640" data-bind="attr:{y1:y,y2:y}"></line><text x="28" data-bind="attr:{y:y+4},text:label"></text></g><polygon class="primary-fill" data-bind="attr:{points:primaryAreaPoints}"></polygon><polyline class="primary" fill="none" data-bind="attr:{points:primaryPoints}"></polyline><polyline class="secondary" fill="none" data-bind="visible:showComparison,attr:{points:secondaryPoints}"></polyline><g data-bind="foreach:primaryDots"><circle class="primary-dot" r="4" data-bind="attr:{cx:x,cy:y}"><title data-bind="text:tooltip"></title></circle></g><g data-bind="foreach:secondaryDots"><circle class="secondary-dot" r="3.5" data-bind="visible:$parent.showComparison,attr:{cx:x,cy:y}"><title data-bind="text:tooltip"></title></circle></g><text class="mb-ops-peak" text-anchor="middle" data-bind="attr:{x:peak.x,y:peak.y},text:peak.value"></text><g data-bind="foreach:labels"><text class="axis" text-anchor="middle" data-bind="attr:{x:x,y:204},text:text"></text></g></svg></div></article>
      <article class="mb-ops-card mb-ops-status"><header><h2>Customer status</h2></header><div class="mb-ops-status-list" data-bind="foreach:customerStatus().segments"><div><i data-bind="style:{backgroundColor:background,color:color}"><span class="oj-ux-ico-user"></span></i><p><small data-bind="text:label"></small><strong data-bind="text:value"></strong></p><em data-bind="text:percent+'%',style:{color:color}"></em></div></div><button class="mb-ops-link" data-bind="click:openCustomers">View all customers <b>›</b></button></article>
      <article class="mb-ops-card mb-ops-composition"><header><h2>Accounts by type</h2><button class="mb-ops-link" data-bind="click:openAccounts">View all</button></header><div class="mb-composition-grid" data-bind="with:accountComposition"><section data-bind="with:number"><h3>By number</h3><div class="mb-mini-donut" data-bind="style:{background:gradient}"><span><strong data-bind="text:total"></strong><small>Total</small></span></div><div class="mb-mini-legend" data-bind="foreach:segments"><div><i data-bind="style:{backgroundColor:color}"></i><span data-bind="text:label"></span><strong data-bind="text:percent+'%'"></strong></div></div></section><section data-bind="with:balance"><h3>By balance</h3><div class="mb-mini-donut" data-bind="style:{background:gradient}"><span><strong data-bind="text:formattedTotal"></strong><small>Total</small></span></div><div class="mb-mini-legend" data-bind="foreach:segments"><div><i data-bind="style:{backgroundColor:color}"></i><span data-bind="text:label"></span><strong data-bind="text:percent+'%'"></strong></div></div></section></div></article>
    </main>
  </oj-bind-if>
  <oj-bind-if test="[[isCustomer()]]"><div class="mb-limitation"><span class="oj-ux-ico-shield"></span><div><small>PRIVACY SAFEGUARD</small><h2>Customer records are protected</h2><p>The portal does not expose another customer's data.</p></div></div></oj-bind-if>
</section>
