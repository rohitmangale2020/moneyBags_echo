<section class="mb-stack mb-account-edit-page">
  <div class="mb-heading"><div><small>ACCOUNTS / OPEN</small><h1>Open account</h1><p>Choose an active product and open an account for the selected customer.</p></div><oj-button chroming="outlined" on-oj-action="[[close]]">Back to accounts</oj-button></div>
  <section class="mb-panel mb-account-edit-form">
    <div class="mb-transaction-submit-state submitting" data-bind="visible:openingAccountForm"><span class="mb-transaction-submit-spinner" aria-hidden="true"></span><strong>Loading account form</strong><p>Preparing available products and account options.</p></div>
    <div class="mb-transaction-submit-state" data-bind="visible:submissionState() !== 'idle',css:submissionState"><span class="mb-transaction-submit-spinner" data-bind="visible:submissionState() === 'submitting'" aria-hidden="true"></span><span class="mb-transaction-submit-icon" data-bind="visible:submissionState() === 'success'" aria-hidden="true">✓</span><span class="mb-transaction-submit-icon" data-bind="visible:submissionState() === 'failure'" aria-hidden="true">!</span><strong data-bind="text:submissionState() === 'submitting' ? 'Processing account' : submissionState() === 'success' ? 'Account complete' : 'Account failed'"></strong><p data-bind="text:submissionMessage"></p></div>
    <div class="mb-stack" data-bind="visible:submissionState() === 'idle' && !openingAccountForm()"><div class="mb-error" data-bind="visible:error,text:error"></div><div class="mb-form">
      <label class="wide"><span>Active product</span><select data-bind="value:form.productId,disable:pendingCreatedAccount"><option value="">Select product</option><!-- ko foreach:products --><option data-bind="attr:{value:String(productId)},text:`${productName} · ${productCode}`"></option><!-- /ko --></select></label>
      <label data-bind="visible:selectedProduct()"><span>Interest rate offered</span><input type="text" disabled="disabled" data-bind="value:selectedProductInterestRate" /></label><label data-bind="visible:selectedProduct()"><span>Tenure</span><input type="text" disabled="disabled" data-bind="value:selectedProductTenure" /></label>
      <label><span>Customer CIF</span><input type="text" data-bind="value:form.customerCif" /></label><label><span data-bind="text:isFixedDeposit() ? 'Fixed deposit principal' : 'Opening deposit'"></span><input type="number" min="0" data-bind="value:form.availableBalance,attr:{min:selectedProductMinimum()}" /><small class="mb-field-rule" data-bind="visible:selectedProduct(),text:selectedProductRule"></small></label>
      <div class="wide mb-info" data-bind="visible:isFixedDeposit()">The FD account opens at zero, then funds from the selected customer account.</div><div class="wide mb-dialog-actions" data-bind="visible:isFixedDeposit()"><oj-button on-oj-action="[[loadFixedDepositAccounts]]" disabled="[[loadingCustomerAccounts]]"><span data-bind="text:loadingCustomerAccounts() ? 'Loading accounts…' : fixedDepositAccountsLoaded() ? 'Reload eligible accounts' : 'Load eligible accounts'"></span></oj-button></div><label class="wide" data-bind="visible:isFixedDeposit()"><span>Fund from customer account</span><select data-bind="value:form.fundingAccountId,options:eligibleFundingAccounts,optionsText:fixedDepositAccountLabel,optionsValue:'accountId',optionsCaption:'Select funding account'"></select></label>
    </div><div class="mb-dialog-actions"><oj-button on-oj-action="[[close]]" disabled="[[busy]]">Cancel</oj-button><oj-button chroming="callToAction" on-oj-action="[[create]]" disabled="[[busy]]">Open account</oj-button></div></div>
  </section>
</section>
