<section class="mb-stack mb-account-edit-page">
  <div class="mb-heading"><div><small>ACCOUNTS / EDIT</small><h1>Edit account</h1><p>Review account details, lifecycle status, and fixed-deposit contract information.</p></div><oj-button chroming="outlined" on-oj-action="[[close]]">Back to accounts</oj-button></div>
  <section class="mb-panel mb-account-edit-form">
    <div class="mb-transaction-submit-state" data-bind="visible:submissionState() !== 'idle',css:submissionState"><span class="mb-transaction-submit-spinner" data-bind="visible:submissionState() === 'submitting'" aria-hidden="true"></span><span class="mb-transaction-submit-icon" data-bind="visible:submissionState() === 'success'" aria-hidden="true">✓</span><span class="mb-transaction-submit-icon" data-bind="visible:submissionState() === 'failure'" aria-hidden="true">!</span><strong data-bind="text:submissionState() === 'submitting' ? 'Processing account' : submissionState() === 'success' ? 'Account complete' : 'Account failed'"></strong><p data-bind="text:submissionMessage"></p></div>
    <div class="mb-stack" data-bind="visible:submissionState() === 'idle'">
      <div class="mb-transaction-submit-state" data-bind="visible:fdWithdrawalState() !== 'idle',css:fdWithdrawalState"><span class="mb-transaction-submit-spinner" data-bind="visible:fdWithdrawalState() === 'submitting'" aria-hidden="true"></span><span class="mb-transaction-submit-icon" data-bind="visible:fdWithdrawalState() === 'success'" aria-hidden="true">✓</span><span class="mb-transaction-submit-icon" data-bind="visible:fdWithdrawalState() === 'failure'" aria-hidden="true">!</span><strong data-bind="text:fdWithdrawalState() === 'submitting' ? 'Withdrawing fixed deposit' : fdWithdrawalState() === 'success' ? 'Fixed deposit withdrawn' : 'Fixed-deposit withdrawal failed'"></strong><p data-bind="text:fdWithdrawalMessage"></p></div>
      <div class="mb-error" data-bind="visible:error,text:error"></div>
      <div class="mb-form">
        <label class="wide"><span>Active product</span><input type="text" disabled="disabled" data-bind="value:productLabel" /></label>
        <label><span>Customer ID</span><input type="text" disabled="disabled" data-bind="value:form.customerId" /></label><label><span>Customer CIF</span><input type="text" disabled="disabled" data-bind="value:form.customerCif" /></label><label><span>Account number</span><input type="text" disabled="disabled" data-bind="value:form.accountNumber" /></label>
        <label><span>Interest rate</span><input type="text" disabled="disabled" data-bind="value:selectedProductInterestRate" /></label><label data-bind="visible:isEditingFixedDeposit"><span>Tenure</span><input type="text" disabled="disabled" data-bind="value:selectedProductTenure" /></label><label><span>Currency</span><input type="text" disabled="disabled" data-bind="value:form.currencyCode" /></label>
        <label data-bind="visible:!closingAccount()"><span>Status</span><select data-bind="value:form.status,disable:isEditingFixedDeposit"><option>ACTIVE</option><option>INACTIVE</option><option>DORMANT</option><option>FROZEN</option></select></label>
        <label data-bind="visible:closingAccount"><span>Closing date</span><input type="date" disabled="disabled" data-bind="value:form.closedAt" /></label>
        <div class="wide mb-info" data-bind="visible:isEditingFixedDeposit() && editingFixedDepositContract()"><span>Fixed-deposit contract: </span><strong data-bind="text:editingFixedDepositStatusLabel"></strong></div>
      </div>
      <div class="mb-dialog-actions" data-bind="visible:!closingAccount() && !isEditingFixedDeposit()"><oj-button chroming="danger" on-oj-action="[[closeAccount]]">Close account</oj-button></div>
      <div class="mb-dialog-actions" data-bind="visible:canWithdrawEditingFixedDeposit"><oj-button chroming="danger" on-oj-action="[[withdrawEditingFixedDeposit]]" disabled="[[withdrawingFdAccountId]]"><span data-bind="text:withdrawingFdAccountId() ? 'Withdrawing fixed deposit…' : 'Withdraw fixed deposit'"></span></oj-button></div>
      <div class="mb-dialog-actions" data-bind="visible:canRetryEditingFixedDeposit"><oj-button chroming="callToAction" on-oj-action="[[retryEditingFixedDeposit]]" disabled="[[retryingFdAccountId]]">Retry FD funding</oj-button></div>
    </div>
    <div class="mb-dialog-actions" data-bind="visible:submissionState() === 'idle'"><oj-button on-oj-action="[[close]]" disabled="[[busy]]">Cancel</oj-button><oj-button chroming="callToAction" on-oj-action="[[create]]" disabled="[[busy]]">Save account</oj-button></div>
  </section>
</section>
