<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover,width=device-width,initial-scale=1"
    />
    <meta name="theme-color" content="#355EB8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='white'/%3E%3Ctext x='18' y='25' text-anchor='middle' font-family='Arial,sans-serif' font-size='20' font-weight='800' fill='%23355eb8'%3EM%3C/text%3E%3C/svg%3E">
    <title>MoneyBags</title>
    <title>MoneyBags Banking</title>
    <link
      rel="stylesheet"
      href="css/redwood/10.1.8/web/redwood.min.css"
    />
    <link rel="stylesheet" href="css/demo-alta-site-min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/modern.css" />
    <link rel="stylesheet" href="css/account-theme.css" />
    <link rel="stylesheet" href="css/table-loaders.css" />
    <link rel="stylesheet" href="css/audit.css" />
  </head>
  <body>
    <a class="mb-skip" href="#mainContent">Skip to content</a>
    <div id="globalBody">
      <script type="text/html" id="navTemplate">
        <li>
          <a href="#" class="mb-nav-link">
            <span
              class="oj-navigationlist-item-icon mb-nav-icon"
              data-bind="css: $data.detail.iconClass"
              aria-hidden="true"
            ></span>
            <span class="mb-nav-label"
              ><oj-bind-text value="[[$data.detail.label]]"></oj-bind-text
            ></span>
          </a>
        </li>
      </script>
      <div id="announce" class="sendOffScreen" :aria-live="[[manner]]">
        <oj-bind-text value="[[message]]"></oj-bind-text>
      </div>
      <oj-bind-if test="[[isAppShellReady]]"
        ><div
          id="navDrawer"
          class="mb-sidebar oj-offcanvas-start"
          data-bind="css:{'mb-sidebar-collapsed':sidebarCollapsed}"
          role="navigation"
        >
          <div class="mb-brand">
            <span class="mb-brand-logo" data-bind="click:toggleSidebar" role="button" tabindex="0" aria-label="Toggle sidebar">M</span>
            <div><strong>MoneyBags</strong><small>Banking platform</small></div>
            <button class="mb-sidebar-toggle" type="button" data-bind="click:toggleSidebar" aria-label="Toggle sidebar">
              <span class="oj-ux-ico-menu" aria-hidden="true"></span>
            </button>
          </div>
          <oj-navigation-list
            data="[[navDataProvider]]"
            edge="start"
            item.renderer="[[KnockoutTemplateUtils.getRenderer('navTemplate',true)]]"
            selection="{{selection.path}}"
            on-click="[[toggleDrawer]]"
          ></oj-navigation-list>
        </div></oj-bind-if
      >
      <div
        id="pageContent"
        class="mb-page"
        data-bind="css:{'mb-page-sidebar-collapsed':sidebarCollapsed}"
      >
        <oj-bind-if test="[[isAppShellReady]]"
          ><header class="mb-topbar">
            <oj-button
              class="oj-md-hide"
              display="icons"
              chroming="borderless"
              on-oj-action="[[toggleDrawer]]"
              ><span slot="startIcon" class="oj-ux-ico-menu"></span
              >Menu</oj-button
            >
            <div class="mb-title">
              <small
                ><oj-bind-text value="[[session.role]]"></oj-bind-text>
                workspace</small
              ><strong>MoneyBags Banking</strong>
            </div>
            <details class="mb-profile-menu">
                <summary aria-label="Open profile menu">
    <span class="mb-avatar">
      <oj-bind-text value="[[initials]]"></oj-bind-text>
    </span>
                    <span class="mb-profile-identity">
      <strong>
        <oj-bind-text value="[[displayName]]"></oj-bind-text>
      </strong>
      <small>
        <oj-bind-text value="[[session.role]]"></oj-bind-text>
      </small>
    </span>
                  <span class="mb-profile-chevron" aria-hidden="true">
  <span class="mb-profile-chevron-icon">⌄</span>
</span>
                </summary>

                <div class="mb-profile-dropdown" role="menu">
                    <button type="button" role="menuitem" on-click="[[openProfile]]" style="color: #273b60; background: #ffffff;">
                        Show profile
                    </button>

                    <button type="button" role="menuitem" on-click="[[signOut]]">
                        Sign out
                    </button>
                </div>
            </details>
          </header></oj-bind-if
        ><oj-bind-if test="[[showActiveCustomerContext]]"><div class="mb-customer-context"><div><small>ACTIVE CUSTOMER</small><strong><oj-bind-text value="[[activeCustomerLabel]]"></oj-bind-text></strong></div><div><oj-button on-oj-action="[[() => go('customers')]]">Customer workspace</oj-button><oj-button on-oj-action="[[clearActiveCustomer]]">Clear</oj-button></div></div></oj-bind-if><oj-module
          id="mainContent"
          role="main"
          class="mb-content"
          config="[[moduleAdapter.koObservableConfig]]"
        ></oj-module>
      </div>
      <button type="button" class="mb-ai-fab" data-bind="click:openAssistant, visible:selection.path() !== 'assistant'" aria-label="Open banking assistant">
        <span class="oj-ux-ico-chat" aria-hidden="true"></span><span>Ask AI</span>
      </button>
      <div class="mb-toasts" aria-live="polite">
        <oj-bind-for-each data="[[toasts]]"
          ><template
            ><div class="mb-toast" :class="[[$current.data.kind]]">
              <span
                ><oj-bind-text
                  value="[[$current.data.text]]"
                ></oj-bind-text></span
              ><button
                on-click="[[dismiss.bind(null,$current.data)]]"
                aria-label="Dismiss"
              >
                ×
              </button>
            </div></template
          ></oj-bind-for-each
        >
      </div>
    </div>
    <script>
      window.oj_whenReady = true;
      window.MONEYBAGS_API_BASE_URL = "";
    </script>
    <script src="js/libs/require/require.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
