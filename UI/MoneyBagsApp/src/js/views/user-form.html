<div class="page-content">
  <div class="page-heading"><div><div class="eyebrow">Identity &amp; access</div><h1><oj-bind-text value="[[title]]"></oj-bind-text></h1><p class="muted">Create or manage a banking-system user identity.</p></div><oj-button on-oj-action="[[cancel]]">Back to directory</oj-button></div>
  <section class="content-card form-card"><h2>Account identity</h2><p class="muted">Required fields are marked with an asterisk.</p>
    <oj-form-layout max-columns="2" direction="row">
      <oj-input-text label-hint="Username" value="{{username}}" required="true"></oj-input-text><oj-input-text label-hint="Email address" value="{{email}}" required="true"></oj-input-text>
      <oj-select-single label-hint="Role" data="[[roleOptions]]" item-text="label" value="{{role}}"></oj-select-single>
      <oj-select-single label-hint="Account status" data="[[statusOptions]]" item-text="label" value="{{status}}"></oj-select-single>
      <oj-bind-if test="[[!isEdit()]]"><oj-input-password label-hint="Initial password" value="{{password}}" required="true"></oj-input-password></oj-bind-if>
    </oj-form-layout>
    <h2 class="form-section">Personal and contact profile</h2>
    <oj-form-layout max-columns="2" direction="row"><oj-input-text label-hint="First name" value="{{firstName}}" required="true"></oj-input-text><oj-input-text label-hint="Middle name" value="{{middleName}}"></oj-input-text><oj-input-text label-hint="Last name" value="{{lastName}}" required="true"></oj-input-text><oj-input-text label-hint="Phone number" value="{{phoneNumber}}"></oj-input-text><div class="native-date-field"><label for="dateOfBirth">Date of birth</label><input id="dateOfBirth" type="date" data-bind="value: dateOfBirth"></div><oj-input-text label-hint="Address line 1" value="{{addressLine1}}"></oj-input-text><oj-input-text label-hint="Address line 2" value="{{addressLine2}}"></oj-input-text><oj-input-text label-hint="City" value="{{city}}"></oj-input-text><oj-input-text label-hint="State / province" value="{{state}}"></oj-input-text><oj-input-text label-hint="Postal code" value="{{postalCode}}"></oj-input-text><oj-input-text label-hint="Country code" value="{{countryCode}}"></oj-input-text></oj-form-layout>
    <oj-bind-if test="[[isEdit]]"><h2 class="form-section">Reset password</h2><oj-form-layout max-columns="1" direction="row"><oj-input-password label-hint="New password" value="{{newPassword}}"></oj-input-password></oj-form-layout></oj-bind-if>
    <p class="form-error"><oj-bind-text value="[[message]]"></oj-bind-text></p><div class="form-actions"><oj-button on-oj-action="[[cancel]]">Cancel</oj-button><oj-bind-if test="[[isEdit]]"><oj-button chroming="danger" on-oj-action="[[deactivate]]" disabled="[[busy]]">Deactivate</oj-button></oj-bind-if><oj-button chroming="callToAction" on-oj-action="[[save]]" disabled="[[busy]]">Save user</oj-button></div>
  </section>
</div>
