server:
  port: 8081




spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:users;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    beans:
      access: read_only
  info:
    env:
      enabled: true

info:
  app:
    bank-name:
    version: 0.0.1
    developer: BLR
    name: SMS Service

logging:
  level:
    root: INFO
    com.training.platform.users: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/usersTestLogs.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
