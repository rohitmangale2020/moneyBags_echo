server:
  port: 8081




spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: system
    password: 123
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.OracleDialect
    show-sql: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    beans:
      access: read_only
  info:
    env:
      enabled: true

info:
  app:
    bank-name:
    version: 0.0.1
    developer: BLR
    name: SMS Service

logging:
  level:
    root: INFO
    com.training.platform.users: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: users/logs/usersTestLogs.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
