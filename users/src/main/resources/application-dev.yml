

server:
  port: 8081

spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: ${DBURL}
    username: ${DBUSERNAME}
    password: ${DBPASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.OracleDialect
    show-sql: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8087}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8087/auth/jwks}
  application:
    name: users-service

eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    hostname: localhost
    prefer-ip-address: false

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    beans:
      access: read_only
  info:
    env:
      enabled: true

info:
  app:
    bank-name:
    version: 0.0.1
    developer: BLR
    name: SMS Service

logging:
  level:
    root: INFO
    com.training.platform.users: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/usersDevLogs.log
  logback:
    rollingpolicy:
      max-file-size: 20MB

