server:
  address: 127.0.0.1
  port: 8081
spring:
  application:
    name: users-service
  cloud:
    config:
      enabled: false
  datasource:
    url: ${DBURL}
    username: ${DBUSER}
    password: ${DBPASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8087}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8087/auth/jwks}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    hostname: localhost
    prefer-ip-address: false
