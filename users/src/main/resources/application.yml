server:
  port: 8081
spring:
  application:
    name: users-service
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  cloud:
    config:
      enabled: false
  datasource:
    url: ${USERS_DB_URL:${DB_URL:${DBURL:}}}
    username: ${USERS_DB_USER:${DB_USER:${DBUSER:}}}
    password: ${USERS_DB_PASSWORD:${DB_PASSWORD:${DBPASSWORD:}}}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8087}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
