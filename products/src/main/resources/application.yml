server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: products-service

  datasource:

    url: ${DBURL}
    username: ${DBUSER}
    password: ${DBPASSWORD}

    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: ECHO

  flyway:
    schemas: ECHO
    default-schema: ECHO
    baseline-on-migrate: true
    baseline-version: 0
    enabled: true
    # The shared ECHO schema contains an earlier V5 migration whose source file
    # is absent from this repository. Keep validating all present migrations.
    ignore-migration-patterns: "*:missing"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8087}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  retirement-risk:
    medium-customer-count: ${RETIREMENT_MEDIUM_CUSTOMER_COUNT:11}
    high-customer-count: ${RETIREMENT_HIGH_CUSTOMER_COUNT:101}
    high-balance: ${RETIREMENT_HIGH_BALANCE:1000000}
  cors:
    allowed-origins: ${PRODUCT_UI_ORIGINS:http://localhost:8000,http://localhost:8001,http://localhost:8002,http://localhost:8082}
