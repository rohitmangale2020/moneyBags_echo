server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: products-service

  datasource:

    url: ${DBURL}
    username: ${DBUSER}
    password: ${DBPASSWORD}

    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: ECHO

  flyway:
    schemas: ECHO
    default-schema: ECHO
    baseline-on-migrate: true
    baseline-version: 0
    enabled: true
    # The shared ECHO schema contains an earlier V5 migration whose source file
    # is absent from this repository. Keep validating all present migrations.
    ignore-migration-patterns: "*:missing"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8087}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8087/auth/jwks}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    hostname: localhost
    prefer-ip-address: false
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${PRODUCT_UI_ORIGINS:http://localhost:8000,http://localhost:8001,http://localhost:8002,http://localhost:8082}
