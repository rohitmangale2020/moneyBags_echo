spring.application.name=products-service

spring.datasource.url=${DBURL}
spring.datasource.username=${DBUSER}
spring.datasource.password=${DBPASSWORD}
#spring.datasource.username=${DBUSERNAME:product_service}
#spring.datasource.password=${DBPASSWORD:product_service}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=ECHO
spring.flyway.schemas=ECHO
spring.flyway.default-schema=ECHO
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.enabled=true
# The shared ECHO schema contains an applied V5 migration absent from this clone.
spring.flyway.ignore-migration-patterns=*:missing

server.port=${SERVER_PORT:8090}
app.cors.allowed-origins=${PRODUCT_UI_ORIGINS:http://localhost:8000,http://localhost:8001,http://localhost:8002,http://localhost:8082}
