server:
  port: 8087
spring:
  application:
    name: security-service
security-service:
  issuer: ${JWT_ISSUER:http://localhost:8087}
  audience: ${JWT_AUDIENCE:banking-api}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:P1D}
  users-url: ${USERS_SERVICE_URL:http://users-service}
  jwt-private-key: ${JWT_PRIVATE_KEY:}
  jwt-public-key: ${JWT_PUBLIC_KEY:}
  key-id: ${JWT_KEY_ID:banking-dev-key}
oda-assistant:
  customers-url: ${ODA_CUSTOMERS_URL:http://customers-service}
  accounts-url: ${ODA_ACCOUNTS_URL:http://accounts-service}
  transactions-url: ${ODA_TRANSACTIONS_URL:http://transactions-service}
  products-url: ${ODA_PRODUCTS_URL:http://products-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
