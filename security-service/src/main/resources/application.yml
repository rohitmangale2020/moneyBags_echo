server:
  port: 8087
spring:
  application:
    name: security-service
  # Local-only convenience: load a repository or module .env file when present.
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
security-service:
  issuer: ${JWT_ISSUER:http://localhost:8087}
  audience: ${JWT_AUDIENCE:banking-api}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:P1D}
  users-url: ${USERS_SERVICE_URL:http://users-service}
  jwt-private-key: ${JWT_PRIVATE_KEY:}
  jwt-public-key: ${JWT_PUBLIC_KEY:}
  key-id: ${JWT_KEY_ID:banking-dev-key}
gpt-oss:
  # Ollama exposes an OpenAI-compatible API at this local address by default.
  base-url: ${GPT_OSS_BASE_URL:http://localhost:11434/v1}
  model: ${GPT_OSS_MODEL:gpt-oss:20b}
  # Leave blank for Ollama; set only when your compatible runtime requires a key.
  api-key: ${GPT_OSS_API_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
