server:
  address: 127.0.0.1
  port: 8082
spring:
  application:
    name: customers-service
  datasource:

    url: ${DBURL}
    username: ${DBUSER}
    password: ${DBPASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.OracleDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8087}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8087/auth/jwks}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    hostname: localhost
    prefer-ip-address: false
