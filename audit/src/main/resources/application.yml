server:
  address: 127.0.0.1
  port: 8086
spring:
  application:
    name: audit-service
  datasource:
    url: ${DBURL}
    username: ${DBUSER}
    password: ${DBPASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8087}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8087/auth/jwks}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    hostname: localhost
    prefer-ip-address: false
